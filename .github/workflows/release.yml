# A tag becomes something a phone can download.
#
# The point of this file is the last three lines: an APK attached to a
# release has a plain URL, and a plain URL is the whole of the install path on
# a phone with no cable near it. Everything above them is the android
# workflow, called rather than copied, so the release build and the build that
# runs on every push are the same build.
name: release

on:
  push:
    # Android's own tags. The Windows app is released from desktop-v* tags
    # by desktop-release.yml; one shared v* would release both at once, and
    # the second to finish would find its release already taken.
    tags: ['android-v*']

jobs:
  # The tag names the version the phone will show, so it has to be the one
  # the build carries: android-v0.2.0 releases versionName 0.2.0 or nothing.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches versionName
        run: |
          want="${GITHUB_REF_NAME#android-v}"
          have=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "tag $want, build.gradle.kts $have"
          test "$want" = "$have"

  build:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A called workflow's artifacts belong to this run, so they are here to
      # be picked up rather than fetched across runs.
      - uses: actions/download-artifact@v4
        with:
          name: relay-apk
          path: apk

      # Named for the tag. Four downloads deep in a phone's folder, three
      # files called app-debug.apk are three files nobody can tell apart.
      - name: name it after the tag
        run: mv apk/*.apk "relay-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: relay-${{ github.ref_name }}.apk
          body: |
            On the phone: download, allow this browser to install unknown
            apps, open it. Configs and the sign-in go in from inside the app;
            no cable is needed.

            Signed with the release key when one is configured for this
            repository, and with the debug key otherwise - the build log says
            which. A build signed with a different key cannot be installed
            over this one; it has to be uninstalled first, and that takes the
            pinned folder with it.
