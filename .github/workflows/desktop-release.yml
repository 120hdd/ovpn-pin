name: desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHON_VERSION: '3.12'
  GOST_VERSION: '3.3.0'
  GOST_ARCHIVE_SHA256: 'cc8ac946f86994a3aed47ef1f838cfb6b7649d9245c91fcb9899654b33d61170'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-desktop-build.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-desktop-build.txt

      - name: Fetch the pinned tunnel client
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gost.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'gost'
          $url = "https://github.com/go-gost/gost/releases/download/v$env:GOST_VERSION/gost_$env:GOST_VERSION`_windows_amd64.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GOST_ARCHIVE_SHA256) {
            throw "gost checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $exe = Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter gost.exe | Select-Object -First 1
          if (-not $exe) { throw 'gost.exe was not present in the verified archive' }
          Copy-Item -LiteralPath $exe.FullName -Destination tunnel/gost.exe

      - name: Test
        shell: pwsh
        run: |
          python -m compileall -q app core
          python app/engine-test.py
          python app/build-test.py
          python app/pin-test.py
          python app/sweep-test.py
          python core/ovpn-proxy-test.py

      - name: Build the public desktop bundle
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:RELAY_VERSION = $env:GITHUB_REF_NAME
          } else {
            $env:RELAY_VERSION = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          python app/build.py --public-release

      - name: Inspect and package the built app
        shell: pwsh
        run: |
          $out = Resolve-Path 'release-build/dist/Relay'
          $required = @(
            'Relay.exe', 'gost.exe', 'install-server.sh', 'README.md',
            'Sweep-OvpnExits.ps1', 'Resolve-OvpnRemote.ps1',
            'servers/lt-vno.prod.surfshark.com_tcp_62.197.149.105.ovpn',
            'servers/tr-ist.ws.tr-022.totallyacdn.com_149.50.208.46.ovpn',
            '_internal/ui/index.html', '_internal/ui/app.js',
            '_internal/ui/app.css', '_internal/ovpn-proxy.py'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $out $_) -PathType Leaf)
          })
          if ($missing) {
            throw "Required release files are missing: $($missing -join ', ')"
          }

          $forbidden = @('.env', '.ovpn-auth', '.windscribe-auth', '.state', 'accounts.json', 'settings.json', 'windscribe.json')
          $leaks = Get-ChildItem -LiteralPath $out -Recurse -Force | Where-Object { $forbidden -contains $_.Name }
          if ($leaks) { throw "Private/runtime files found: $($leaks.FullName -join ', ')" }

          $starters = @(Get-ChildItem -LiteralPath (Join-Path $out 'servers') -File -Filter '*.ovpn')
          if ($starters.Count -ne 10) { throw "Expected 10 public starters, found $($starters.Count)" }

          # Launch the frozen program itself. Source-level tests cannot catch a
          # module omitted by PyInstaller from a dynamically loaded data file.
          $process = Start-Process -FilePath (Join-Path $out 'Relay.exe') `
            -ArgumentList '--selftest' -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $process.Id -Timeout 30 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Frozen Relay self-test did not exit within 30 seconds'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Frozen Relay self-test failed with exit code $($process.ExitCode)"
          }

      - name: Check SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          ) | Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing) { throw "Missing SignPath secret/variables: $($missing -join ', ')" }

      - name: Upload unsigned bundle for origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64-unsigned
          path: release-build/dist/Relay/*
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-build/signed

      - name: Package the signed bundle
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -LiteralPath 'release-build/signed' -Recurse -File -Filter 'Relay.exe')
          if ($exe.Count -ne 1) { throw "Expected one signed Relay.exe, found $($exe.Count)" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Relay.exe signature is not valid: $($signature.Status)"
          }
          $root = $exe[0].Directory.FullName
          $name = "Relay-windows-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$name.sha256"
          "RELEASE_ZIP=$name" >> $env:GITHUB_ENV

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64
          path: |
            Relay-windows-x64-*.zip
            Relay-windows-x64-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "$env:RELEASE_ZIP" `
            "$env:RELEASE_ZIP.sha256" `
            --title "Relay $env:GITHUB_REF_NAME" `
            --generate-notes `
            --notes "Windows x64 desktop build, signed by SignPath Foundation. Extract the whole ZIP, then run Relay.exe. The bundle includes credential-free starter servers for Surfshark and Windscribe; add your own provider account in the app. Accounts and credentials are not included in the download. Code signing policy: https://github.com/120hdd/ovpn-pin/blob/$env:GITHUB_REF_NAME/CODE_SIGNING_POLICY.md"
