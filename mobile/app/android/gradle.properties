org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Off, and not for speed: the project lives on F: and Flutter's package cache
# on C:, and Kotlin's incremental compiler builds relative paths between the
# two. Across drive roots that is not a path, and the build dies with
#
#   this and base files have different roots:
#     C:\Users\bashi\AppData\Local\Pub\Cache\...\webview_flutter_android
#     F:\Projects\ovpn-pin-main\mobile\app\android
#
# The alternative is moving one of them so both share a root. This costs a few
# seconds a build and needs nothing moved.
kotlin.incremental=false
